  <style>
    html, body { margin: 0; height: 100%; background: #fff; color: #1f2328;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif; }
    .box { max-width: 380px; margin: 0 auto; padding: 18vh 20px 20px; text-align: center; }
    .logo { width: 200px; max-width: 70%; height: auto; margin: 0 auto 16px; display: block; }
    h1 { font-size: 1.4rem; margin: 0 0 18px; }
    .spin { width: 38px; height: 38px; margin: 0 auto 12px; border: 4px solid #d5d8d3; border-top-color: #1f2328; border-radius: 50%; animation: s .9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    p { color: #5b626b; margin: 6px 0; }
    #err { display: none; margin-top: 18px; padding: 14px; border-radius: 12px; background: #fbeaea; color: #b3261e; }
    button { margin-top: 12px; width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: #1f2328; color: #fff; font-size: 1rem; font-weight: 700; }
  </style>

<body>
  <div class="box">
    <img class="logo" src="../logoblack.webp" alt="WheelsEye">
    <h1>AM Visitor · Master</h1>
    <div id="wait"><div class="spin"></div><p>ऐप खुल रहा है…</p><p style="font-size:.9rem">App is opening</p></div>
    <div id="err">
      <b>ऐप नहीं खुला</b><br>इंटरनेट चेक करें और दोबारा कोशिश करें।
      <button type="button" onclick="load()">दोबारा खोलें / Try again</button>
    </div>
  </div>
  <script>
    // Apps Script link (/exec). The app opens right here, so the Google banner never shows.
    var APP_URL = 'https://script.google.com/macros/s/AKfycby5OasStA08ZfxH1LN9EnWMAZ6VzCFjDzNKFhx2ozKCMoKcny0G5FR0BEPv0tB1Md9e/exec';
    function load() {
      document.getElementById('err').style.display = 'none';
      document.getElementById('wait').style.display = 'block';
      var q = location.search ? '&' + location.search.slice(1) : '';
      fetch(APP_URL + '?page=app' + q, { redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (html) {
          if (html.indexOf('var BOOT') < 0) throw new Error('not the app');
          try { localStorage.setItem('amv_app_html', html); } catch (e) {}
          document.open(); document.write(html); document.close();
        })
        .catch(function () {
          document.getElementById('wait').style.display = 'none';
          document.getElementById('err').style.display = 'block';
        });
    }
    // Opened before on this phone? Show the saved app at once (it refreshes itself in the background)
    var saved = null;
    try { if (localStorage.getItem('amv_app_ok') === '1') saved = localStorage.getItem('amv_app_html'); } catch (e) {}
    function showSaved() { document.open(); document.write(saved); document.close(); }
    if (saved && saved.indexOf('var BOOT') >= 0) {
      // wait until this small page has finished loading, so the saved app REPLACES it (not added below it)
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(showSaved, 0); });
      else setTimeout(showSaved, 0);
    } else load();
  </script>
